# Add where host networking doesn't reach the host's own ports (Docker Desktop on Windows/macOS):
# COMPOSE_FILE=docker-compose.yml:compose.bridge.yml in .env. The app is then published on MEDIA_PORT, and
# host.docker.internal reaches services on the host itself (e.g. a database tunnel).
services:
  media:
    network_mode: bridge
    ports:
      - "127.0.0.1:${MEDIA_PORT:-8093}:${MEDIA_PORT:-8093}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
