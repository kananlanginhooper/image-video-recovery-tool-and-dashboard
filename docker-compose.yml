# Media library on its own: `docker compose up -d --build`. Both services restart with Docker, so nothing needs a manual start.
# Settings come from .env (see .env.example). It reads an existing catalogue in MySQL; it never runs a database itself.
services:
  media:
    build:
      context: .
      args:
        UI_CONFIG: ${UI_CONFIG:-production}
    image: media-library
    restart: unless-stopped
    # published on MEDIA_HOST:MEDIA_PORT of this machine; inside, the app always listens on 0.0.0.0:8093.
    # MySQL is reached at DB_HOST like any LAN client (host.docker.internal = this machine)
    ports:
      - "${MEDIA_HOST:-0.0.0.0}:${MEDIA_PORT:-8093}:8093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    # every .env setting also reaches the container, so plugins can read their own (the list below sets the defaults)
    env_file:
      - path: .env
        required: false
    environment:
      # paths inside the container (the .env values of the same names are host paths, used for the mounts below)
      MEDIA_DB_CNF: /run/secrets/db.cnf
      MEDIA_CACHE: /cache
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: 8093
      MEDIA_REVIEWER: ${MEDIA_REVIEWER:-owner}
      MEDIA_FILES_UPSTREAM: ${MEDIA_FILES_UPSTREAM:-}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
    volumes:
      # only used when DB_USER is empty: a MySQL client config file instead of the DB_* settings
      - ${MEDIA_DB_CNF:-./db.cnf}:/run/secrets/db.cnf:ro
      - ${MEDIA_CACHE_DIR:-./cache}:/cache

  # Rebuilds the media_browse index every REFRESH_EVERY seconds with REFRESH_SQL (your own catalogue's query),
  # from the app's own image (api/refresh.py) with the same database settings.
  # Off by default; turn it on with `docker compose --profile refresh up -d` if nothing else rebuilds the index.
  refresh:
    profiles: [refresh]
    image: media-library
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${MEDIA_UID:-1000}:${MEDIA_GID:-1000}"
    command: ["python", "refresh.py"]
    volumes:
      - ${MEDIA_DB_CNF:-./db.cnf}:/run/secrets/db.cnf:ro
      - ${REFRESH_SQL:-./api/private/media_browse_refresh.sql}:/refresh.sql:ro
    environment:
      REFRESH_EVERY: ${REFRESH_EVERY:-1800}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
