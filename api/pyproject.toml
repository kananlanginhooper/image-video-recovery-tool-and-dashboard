[project]
name = "media-library-api"
version = "0.0.0"
authors = [{ name = "Kanan Hooper" }]

[project.urls]
Author = "https://github.com/kananlanginhooper"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702"]   # short "a; b" pairs in where_from() read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
